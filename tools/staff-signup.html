<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP — Staff User Tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; color: #1a1a2e; }
    .page-header p  { margin-top: 6px; color: #555; font-size: 0.9rem; }
    .dev-badge {
      display: inline-block;
      background: #f59e0b;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 520px;
    }

    /* ── API config bar ─────────────────────────────────────────────── */
    .api-bar {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .api-bar label { font-size: 0.8rem; font-weight: 600; color: #475569; white-space: nowrap; }
    .api-bar input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.83rem;
      color: #334155;
      outline: none;
    }
    .api-bar input:focus { border-color: #6366f1; }
    .api-bar button {
      padding: 6px 14px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .api-bar button:hover { background: #4f46e5; }

    /* ── Tabs ────────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 28px;
      gap: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      font-size: 0.88rem;
      font-weight: 600;
      color: #6b7280;
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn:hover { color: #4f46e5; }
    .tab-btn.active { color: #6366f1; border-bottom-color: #6366f1; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Form fields ─────────────────────────────────────────────────── */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
    }
    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
      background: #fff;
    }
    .field input:focus, .field select:focus { border-color: #6366f1; }
    .field input::placeholder { color: #9ca3af; }
    .field select:disabled, .field input:disabled { background: #f3f4f6; cursor: not-allowed; }
    .field .hint { margin-top: 4px; font-size: 0.75rem; color: #6b7280; }

    /* ── Role cards ─────────────────────────────────────────────────── */
    .role-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .role-card {
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: center;
    }
    .role-card:hover { border-color: #a5b4fc; background: #f5f3ff; }
    .role-card.selected { border-color: #6366f1; background: #eef2ff; }
    .role-card input[type="radio"] { display: none; }
    .role-card .role-icon { font-size: 2rem; margin-bottom: 6px; }
    .role-card .role-name { font-weight: 700; font-size: 0.9rem; color: #1e1b4b; }
    .role-card .role-desc { font-size: 0.74rem; color: #6b7280; margin-top: 3px; }

    .divider { border: none; border-top: 1px solid #f0f0f0; margin: 8px 0 20px; }

    /* ── Buttons ─────────────────────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Alerts ─────────────────────────────────────────────────────── */
    .alert {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
    }
    .alert.show { display: block; }
    .alert-error   { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .alert-info    { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
    .alert-success strong { display: block; margin-bottom: 4px; }

    /* ── Token box ───────────────────────────────────────────────────── */
    .token-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      font-size: 0.75rem;
      word-break: break-all;
      color: #334155;
      max-height: 80px;
      overflow-y: auto;
      font-family: monospace;
    }
    .token-copy {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 10px;
      background: #e0e7ff;
      color: #3730a3;
      border: none;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .token-copy:hover { background: #c7d2fe; }

    /* ── Verify card ─────────────────────────────────────────────────── */
    .verify-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
    }
    .verify-card h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .verify-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      padding: 5px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .verify-row:last-child { border-bottom: none; }
    .verify-row .vk { color: #6b7280; font-weight: 600; }
    .verify-row .vv { color: #111827; text-align: right; word-break: break-all; max-width: 65%; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-red   { background: #fef2f2; color: #b91c1c; }
    .badge-blue  { background: #dbeafe; color: #1e40af; }

    /* ── Spinner ─────────────────────────────────────────────────────── */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="page-header">
  <div class="dev-badge">Dev Tool</div>
  <h1>ERP — Staff User Tool</h1>
  <p>Register new staff users or verify existing accounts in Clerk + DB.</p>
</div>

<div class="card">

  <!-- API base URL config -->
  <div class="api-bar">
    <label for="apiBase">API</label>
    <input id="apiBase" type="text" value="http://localhost:3000" placeholder="https://your-api.onrender.com" />
    <button onclick="loadDropdowns()">Load</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('register', this)">Register User</button>
    <button class="tab-btn" onclick="switchTab('login', this)">Login &amp; Verify</button>
  </div>

  <!-- ───────────────────── REGISTER TAB ───────────────────────── -->
  <div class="tab-panel active" id="tab-register">

    <div class="alert alert-info"    id="reg-alertInfo"></div>
    <div class="alert alert-error"   id="reg-alertError"></div>
    <div class="alert alert-success" id="reg-alertSuccess"></div>

    <form id="signupForm" onsubmit="handleRegister(event)" novalidate>

      <div class="form-row">
        <div class="field">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" placeholder="John" required />
        </div>
        <div class="field">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" placeholder="Doe" required />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="john@example.com" required />
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="johndoe" required />
        <div class="hint">Unique identifier used to sign in (no spaces).</div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="min 8 characters" minlength="8" required />
        <div class="hint">User signs in with this email + password on the mobile app.</div>
      </div>

      <hr class="divider" />

      <div class="field">
        <label for="orgSelect">Organization</label>
        <select id="orgSelect" required>
          <option value="">— click Load above first —</option>
        </select>
      </div>

      <div class="field">
        <label>Role</label>
        <div class="role-cards" id="roleCards">
          <div class="role-card">
            <div class="role-icon">⏳</div>
            <div class="role-name">Loading…</div>
            <div class="role-desc">Click Load above</div>
            <input type="radio" name="role" value="" />
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="regSubmitBtn">
        <div class="spinner" id="regSpinner"></div>
        <span id="regSubmitLabel">Create Staff User</span>
      </button>

    </form>
  </div>

  <!-- ───────────────────── LOGIN & VERIFY TAB ─────────────────── -->
  <div class="tab-panel" id="tab-login">

    <div class="alert alert-info"    id="login-alertInfo"></div>
    <div class="alert alert-error"   id="login-alertError"></div>
    <div class="alert alert-success" id="login-alertSuccess"></div>

    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="john@example.com" required />
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="password" required />
      </div>

      <button type="submit" class="btn-primary" id="loginSubmitBtn">
        <div class="spinner" id="loginSpinner"></div>
        <span id="loginSubmitLabel">Sign In with Clerk</span>
      </button>

    </form>

    <!-- Token output -->
    <div id="tokenSection" style="display:none; margin-top:20px;">
      <div style="font-size:0.82rem; font-weight:600; color:#374151; margin-bottom:4px;">
        Clerk JWT Token
      </div>
      <div class="token-box" id="tokenDisplay"></div>
      <button class="token-copy" onclick="copyToken()">Copy Token</button>
    </div>

    <!-- Verify card — populated after login -->
    <div class="verify-card" id="verifyCard" style="display:none;">
      <h3>✅ Clerk + DB Verification</h3>
      <div id="verifyRows"></div>
    </div>

  </div>

</div><!-- .card -->

<script>
  const ROLE_ICONS = {
    super_admin:    '🛡️',
    org_admin:      '🏢',
    branch_manager: '🏬',
    driver:         '🚚',
    packer:         '📦',
  };
  const ROLE_DESCS = {
    super_admin:    'Full platform access across all organizations',
    org_admin:      'Full access within an organization',
    branch_manager: 'Manages locations within a branch',
    driver:         'Manages delivery trips and confirms drop-offs',
    packer:         'Claims and packs orders in the warehouse',
  };

  let selectedRoleId = null;
  let currentToken   = null;

  /* ── Helpers ─────────────────────────────────────────────────── */

  function apiBase() {
    return document.getElementById('apiBase').value.replace(/\/$/, '');
  }

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach((b)  => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  function showAlert(prefix, type, html) {
    ['Info', 'Error', 'Success'].forEach((t) => {
      const el = document.getElementById(prefix + '-alert' + t);
      if (!el) return;
      el.classList.remove('show');
      el.innerHTML = '';
    });
    if (type && html) {
      const el = document.getElementById(prefix + '-alert' + type);
      if (el) { el.innerHTML = html; el.classList.add('show'); }
    }
  }

  function setLoading(btnId, spinnerId, labelId, loading, loadingText, idleText) {
    document.getElementById(btnId).disabled        = loading;
    document.getElementById(spinnerId).style.display = loading ? 'block' : 'none';
    document.getElementById(labelId).textContent    = loading ? loadingText : idleText;
  }

  /* ── Load dropdowns ──────────────────────────────────────────── */

  async function loadDropdowns() {
    showAlert('reg', 'Info', 'Loading organizations and roles…');
    try {
      const base = apiBase();
      const [orgsRes, rolesRes] = await Promise.all([
        fetch(`${base}/api/v1/auth/dev/organizations`),
        fetch(`${base}/api/v1/auth/dev/roles`),
      ]);

      if (!orgsRes.ok)  throw new Error(`Organizations: ${orgsRes.status} ${orgsRes.statusText}`);
      if (!rolesRes.ok) throw new Error(`Roles: ${rolesRes.status} ${rolesRes.statusText}`);

      const orgs  = await orgsRes.json();
      const roles = await rolesRes.json();

      // Orgs
      const orgSelect = document.getElementById('orgSelect');
      orgSelect.innerHTML = '<option value="">— select organization —</option>';
      orgs.forEach((org) => {
        const opt = document.createElement('option');
        opt.value = org.id;
        opt.textContent = org.name;
        orgSelect.appendChild(opt);
      });

      // Roles
      const roleCards = document.getElementById('roleCards');
      roleCards.innerHTML = '';
      selectedRoleId = null;

      if (roles.length === 0) {
        roleCards.innerHTML = '<div style="color:#b91c1c;font-size:0.85rem">No picker/driver roles found. Check DB seeds.</div>';
      } else {
        roles.forEach((role) => {
          const card = document.createElement('div');
          card.className = 'role-card';
          card.dataset.roleId = role.id;
          card.innerHTML = `
            <div class="role-icon">${ROLE_ICONS[role.name] ?? '👤'}</div>
            <div class="role-name">${capitalize(role.name)}</div>
            <div class="role-desc">${ROLE_DESCS[role.name] ?? ''}</div>
            <input type="radio" name="role" value="${role.id}" />
          `;
          card.addEventListener('click', () => selectRole(card, role.id));
          roleCards.appendChild(card);
        });
      }

      showAlert('reg', 'Info', `Loaded <strong>${orgs.length}</strong> org(s) and <strong>${roles.length}</strong> role(s).`);
    } catch (err) {
      showAlert('reg', 'Error', `Failed to load: ${err.message}. Make sure the API is running.`);
    }
  }

  function selectRole(card, roleId) {
    document.querySelectorAll('.role-card').forEach((el) => el.classList.remove('selected'));
    card.classList.add('selected');
    selectedRoleId = roleId;
    const radio = card.querySelector('input[type="radio"]');
    if (radio) radio.checked = true;
  }

  /* ── Register handler ────────────────────────────────────────── */

  async function handleRegister(event) {
    event.preventDefault();
    showAlert('reg', null, null);

    const firstName      = document.getElementById('firstName').value.trim();
    const lastName       = document.getElementById('lastName').value.trim();
    const email          = document.getElementById('email').value.trim();
    const username       = document.getElementById('username').value.trim();
    const password       = document.getElementById('password').value;
    const organizationId = document.getElementById('orgSelect').value;

    if (!firstName || !lastName || !email || !username || !password) {
      return showAlert('reg', 'Error', 'Please fill in all fields.');
    }
    if (password.length < 8) {
      return showAlert('reg', 'Error', 'Password must be at least 8 characters.');
    }
    if (!organizationId) {
      return showAlert('reg', 'Error', 'Please select an organization.');
    }
    if (!selectedRoleId) {
      return showAlert('reg', 'Error', 'Please select a role (Picker or Driver).');
    }

    setLoading('regSubmitBtn', 'regSpinner', 'regSubmitLabel', true, 'Creating user…', 'Create Staff User');

    try {
      const res = await fetch(`${apiBase()}/api/v1/auth/mobile/register`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ firstName, lastName, email, username, password, organizationId, roleId: selectedRoleId }),
      });

      const data = await res.json();

      if (!res.ok) {
        const msg = data?.message ?? data?.error ?? `HTTP ${res.status}`;
        throw new Error(Array.isArray(msg) ? msg.join(', ') : msg);
      }

      showAlert('reg', 'Success', `
        <strong>✅ User registered in Clerk + DB</strong>
        <div style="margin-top:8px; font-size:0.82rem;">
          <div><span style="color:#166534;font-weight:600">Email:</span> ${email}</div>
          <div><span style="color:#166534;font-weight:600">DB User ID:</span> <code style="background:#dcfce7;padding:1px 5px;border-radius:4px">${data.userId}</code></div>
        </div>
        <div style="margin-top:8px;font-size:0.78rem;color:#166534">
          Switch to <strong>Login &amp; Verify</strong> tab to confirm the Clerk token and DB profile.
        </div>
      `);

      // Pre-fill login tab for quick verification
      document.getElementById('loginEmail').value    = email;
      document.getElementById('loginPassword').value = password;

      document.getElementById('signupForm').reset();
      document.querySelectorAll('.role-card').forEach((el) => el.classList.remove('selected'));
      selectedRoleId = null;

    } catch (err) {
      showAlert('reg', 'Error', `Registration failed: ${err.message}`);
    } finally {
      setLoading('regSubmitBtn', 'regSpinner', 'regSubmitLabel', false, '', 'Create Staff User');
    }
  }

  /* ── Login & Verify handler ──────────────────────────────────── */

  async function handleLogin(event) {
    event.preventDefault();
    showAlert('login', null, null);
    document.getElementById('tokenSection').style.display = 'none';
    document.getElementById('verifyCard').style.display   = 'none';
    currentToken = null;

    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      return showAlert('login', 'Error', 'Enter email and password.');
    }

    setLoading('loginSubmitBtn', 'loginSpinner', 'loginSubmitLabel', true, 'Signing in…', 'Sign In with Clerk');

    try {
      // Step 1 — get Clerk JWT
      const loginRes = await fetch(`${apiBase()}/api/v1/auth/login`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password }),
      });
      const loginData = await loginRes.json();

      if (!loginRes.ok) {
        const msg = loginData?.message ?? loginData?.error ?? `HTTP ${loginRes.status}`;
        throw new Error(Array.isArray(msg) ? msg.join(', ') : msg);
      }

      currentToken = loginData.token;
      document.getElementById('tokenDisplay').textContent = currentToken;
      document.getElementById('tokenSection').style.display = 'block';

      // Step 2 — sync user (JIT provision)
      await fetch(`${apiBase()}/api/v1/auth/sync`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${currentToken}` },
      });

      // Step 3 — fetch /me to verify Clerk + DB
      const meRes = await fetch(`${apiBase()}/api/v1/auth/me`, {
        headers: { Authorization: `Bearer ${currentToken}` },
      });
      const me = await meRes.json();

      if (!meRes.ok) {
        throw new Error(me?.message ?? `GET /auth/me → ${meRes.status}`);
      }

      renderVerifyCard(me);
      showAlert('login', 'Success', '✅ Signed in and verified against Clerk + DB successfully.');

    } catch (err) {
      showAlert('login', 'Error', `Login failed: ${err.message}`);
    } finally {
      setLoading('loginSubmitBtn', 'loginSpinner', 'loginSubmitLabel', false, '', 'Sign In with Clerk');
    }
  }

  function renderVerifyCard(me) {
    const rows = [
      { k: 'Clerk User ID',  v: me.clerkUserId ?? '—', style: '' },
      { k: 'DB User ID',     v: me.id ?? '—',          style: '' },
      { k: 'Name',           v: [me.firstName, me.lastName].filter(Boolean).join(' ') || '—' },
      { k: 'Email',          v: me.email ?? '—' },
      { k: 'Onboarded',      v: me.isOnboarded
          ? '<span class="badge badge-green">Yes</span>'
          : '<span class="badge badge-red">No</span>' },
      { k: 'Organization',   v: me.organization?.name
          ? `<span class="badge badge-blue">${me.organization.name}</span>`
          : '<span class="badge badge-red">None</span>' },
      { k: 'Org ID',         v: me.organization?.id ?? '—' },
      { k: 'Roles',          v: (me.roles ?? []).length > 0
          ? me.roles.map((r) => `<span class="badge badge-blue">${r}</span>`).join(' ')
          : '<span class="badge badge-red">None</span>' },
    ];

    const html = rows.map(({ k, v }) =>
      `<div class="verify-row"><span class="vk">${k}</span><span class="vv">${v}</span></div>`
    ).join('');

    document.getElementById('verifyRows').innerHTML = html;
    document.getElementById('verifyCard').style.display = 'block';
  }

  function copyToken() {
    if (!currentToken) return;
    navigator.clipboard.writeText(currentToken).then(() => {
      const btn = document.querySelector('.token-copy');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy Token'; }, 1500);
    });
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  window.addEventListener('DOMContentLoaded', loadDropdowns);
</script>
