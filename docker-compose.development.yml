services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: core-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    image: ${BACKEND_IMAGE:-core-apis-backend:latest}
    container_name: core-backend
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "10000:10000"

    env_file:
      - .env

volumes:
  qdrant_storage:
